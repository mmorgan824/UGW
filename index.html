<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGW</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  .dvd-logo {
    position: absolute;
    width: 20vw;
    max-width: 180px;
    min-width: 100px;
    cursor: pointer;
  }

  .dvd-logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 480px) {
    .dvd-logo {
      width: 30vw;
      min-width: 90px;
    }
  }
</style>
</head>

<body>

<a href="Home.html" class="dvd-logo" id="logo">
  <img src="img/ugw.png" alt="UGW Logo">
</a>

<!-- Hidden YouTube Audio Player -->
<div id="player" style="position:absolute; left:-9999px;"></div>

<!-- Load YouTube API properly -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  let started = false;

  const videoID = "dQw4w9WgXcQ"; 
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '0',
      width: '0',
      videoId: videoID,
      playerVars: {
        autoplay: 0,
        controls: 0,
        loop: 1,
        playlist: videoID
      }
    });
  }

  // Start audio on first click anywhere
  document.addEventListener("click", function () {
    if (!started && player && player.playVideo) {
      player.playVideo();
      started = true;
    }
  });
</script>

<script>
  const logo = document.getElementById("logo");

  let x = 100;
  let y = 100;
  let dx = 4;
  let dy = 4;

  function animate() {
    const logoWidth = logo.offsetWidth;
    const logoHeight = logo.offsetHeight;
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    x += dx;
    y += dy;

    if (x + logoWidth >= screenWidth || x <= 0) {
      dx = -dx;
    }

    if (y + logoHeight >= screenHeight || y <= 0) {
      dy = -dy;
    }

    logo.style.left = x + "px";
    logo.style.top = y + "px";

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
