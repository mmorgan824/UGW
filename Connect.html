<section id="connect">
  <h2>📬 Connect</h2>
  <p>Reach out, schedule a collab, or leave a message. We'll get back to you as soon as possible.</p>

  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
    <div class="form-group">
      <label for="name">Name*</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>
    </div>

    <div class="form-group">
      <label for="email">Email*</label>
      <input type="email" id="email" name="_replyto" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="message">Message*</label>
      <textarea id="message" name="message" rows="6" placeholder="Tell us what’s on your mind…" required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>
</section>
