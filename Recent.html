<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UGW: Vlogs</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- External CSS -->
  <link rel="stylesheet" href="UGW.css">
</head>

<body class="vlogs-page">

<!-- HEADER -->
<header>
  <div class="header-logo">
    <a href="Home.html"> 
      <img src="img/ugw.png" alt="UGW Logo">
    </a>
  </div>
</header>

<!-- VLOG SECTION -->
<section id="vlogs">
  <h2>Recent</h2>

  <div class="vlog-grid">

    <!-- Instagram -->
    <div class="video-card">
      <blockquote 
        class="instagram-media"
        data-instgrm-permalink="https://www.instagram.com/reel/DWgwNrqjlxw/"
        data-instgrm-version="14">
      </blockquote>
    </div>

    <!-- YouTube -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/ayZ7KiJFxlU"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

  </div>
</section>

<!-- Instagram Script -->
<script async src="https://www.instagram.com/embed.js"></script>

<!-- FOOTER -->
<footer>
  <p>© 2026 UGW: Under Ground World. All Rights Reserved.</p>
</footer>

</html>
